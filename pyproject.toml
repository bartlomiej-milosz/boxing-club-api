[project]
name = "boxing-club-api"
version = "0.1.0"
description = "A single-club boxing training booking API"
readme = "README.md"
authors = [
    { name = "Bartłomiej Miłosz", email = "bartlomiej.milosz@gmail.com" },
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1,<2.0.0",
    "fastapi>=0.162.0,<0.163.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "pwdlib[argon2]>=0.3.1,<0.4.0",
    "pydantic>=2.14.2,<3.0.0",
    "pydantic-settings>=2.16.2,<3.0.0",
    "sqlalchemy>=2.1.6,<3.0.0",
    "uvicorn>=0.54.0,<0.55.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.3,<0.18.0",
    "ty>=0.0.95,<0.0.96",
]

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["src", "migrations", "tests"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: requires an explicitly isolated PostgreSQL test database",
    "concurrency: uses independent transactions and coordinated competitors",
]

[tool.coverage.run]
branch = true
source = ["boxing_club_api"]

[tool.coverage.report]
show_missing = true
