name: boxing-club-api

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: boxing_club
      POSTGRES_USER: boxing_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
      APP_DB_USER: boxing_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
