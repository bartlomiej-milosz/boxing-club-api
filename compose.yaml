name: boxing-club-api

services:
  migrate:
    build: .
    image: boxing-club-api:local
    profiles: [app]
    command: [alembic, upgrade, head]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://boxing_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/boxing_club
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: boxing-club-api:local
    profiles: [app]
    environment:
      DATABASE_URL: postgresql+psycopg://boxing_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/boxing_club
      APP_ENV: local
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: boxing_club
      POSTGRES_USER: boxing_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
      APP_DB_USER: boxing_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
